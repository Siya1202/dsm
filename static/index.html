<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movie feed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Recommendation feed</h1>
          <p>
            Pick three genres, load your 60/30/10 mix, then mark watches to
            update taste.
          </p>
        </div>
        <p class="header-links">
          <a href="/docs">API docs</a>
          ·
          <a href="/redoc">ReDoc</a>
        </p>
      </header>

      <section class="panel" aria-labelledby="onboard-heading">
        <h2 id="onboard-heading">You</h2>
        <div class="row">
          <label for="userId">User id</label>
          <input type="number" id="userId" name="userId" min="1" value="1" />
        </div>
        <div class="row">
          <span class="hint" style="margin: 0"
            >Choose exactly three genres (tap to toggle).</span
          >
        </div>
        <div id="genreGrid" class="genre-grid"></div>
        <div class="row" style="margin-top: 1rem">
          <button type="button" class="btn btn-primary" id="onboardBtn">
            Save preferences
          </button>
          <button type="button" class="btn btn-secondary" id="refreshFeedBtn">
            Refresh feed only
          </button>
        </div>
        <div id="onboardStatus" class="status" role="status"></div>
      </section>

      <section class="panel" aria-labelledby="feed-heading">
        <h2 id="feed-heading">Your feed</h2>
        <div id="feedMeta" class="feed-meta"></div>
        <div id="feedStatus" class="status" role="status"></div>
        <div id="movieGrid" class="movie-grid"></div>
      </section>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
